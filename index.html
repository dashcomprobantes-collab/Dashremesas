}

/* textos que van directo sobre el fondo (no dentro de una tarjeta) */
main>.row,main>.row .muted,main>p.muted,label.chk{color:var(--on-page-muted)}
main>.row b,h2.sectit{color:var(--on-page)}
h2.sectit{font-size:16px;margin:18px 0 10px}
h2.sectit:first-child{margin-top:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,#14287a 0%,#1d3fb0 70%,#2347c4 100%);border-bottom:3px solid var(--gold);padding:9px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:#fff}
header h1{margin:0;flex:1;display:flex;align-items:center;gap:9px}
header h1 .logo{width:30px;height:30px;flex:none;overflow:visible;filter:drop-shadow(0 0 .7px rgba(255,255,255,.95)) drop-shadow(0 0 2px rgba(255,255,255,.35))} /* v10: sin fondo; borde claro fino para que la D azul se vea sobre el encabezado azul */
header h1 .marca{display:flex;flex-direction:column;min-width:0;line-height:1.15}
header h1 .marca b{font-size:17px;font-weight:800;color:#fff;letter-spacing:.01em;white-space:nowrap}
header h1 .marca small{font-size:11.5px;font-weight:600;color:var(--gold-2);letter-spacing:.03em;white-space:nowrap}
header select{width:auto;font-size:13px;line-height:1.3;padding:3px 8px;border-radius:7px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
header select option{color:#0f1a3d}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.brand{background:var(--brand-soft);color:var(--brand)}
nav.tabs{display:flex;gap:2px;padding:0 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:var(--hdr-h,56px);z-index:19;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:12px 12px 10px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs button.on{color:var(--brand);font-weight:700;border-bottom-color:var(--gold)}
main{max-width:1100px;margin:0 auto;padding:16px 16px calc(130px + env(safe-area-inset-bottom))}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
@media (max-width:640px){.grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}}
/* v6: Dashboard en 3 columnas (2 en teléfono); si el número de tarjetas es impar, la de ganancia ocupa la fila completa */
.grid.dash{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.dash.impar>.hero{grid-column:1/-1}
@media (max-width:640px){.grid.dash{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.dash.impar>.hero{grid-column:1/-1}}
.kpi .v{overflow-wrap:anywhere}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:600}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.01em}
.kpi .s{font-size:13px;color:var(--muted);margin-top:2px}
.sec{margin-top:16px}
.sec>h2{font-size:16px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:9px;cursor:pointer}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#14287a;font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.progress{height:10px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:8px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));border-radius:99px}
.kpi.hero{background:linear-gradient(135deg,#14287a,#1d3fb0);border-color:#14287a;color:#fff}
.kpi.hero h3,.kpi.hero .s{color:#c9d3f5}.kpi.hero .v{color:var(--gold-2)}
/* v7: unidad "USDT" del número grande un poco más pequeña */
.kpi.hero .v .u{font-size:.62em;font-weight:600;letter-spacing:.02em}
.kpi.hero .tot{margin-top:8px;padding-top:7px;border-top:1px solid rgba(255,255,255,.22);font-size:14px;color:#fff}.kpi.hero .tot b{color:var(--gold-2)}.kpi.hero .tot b.neg{color:#fca5a5}
.kpi.gold{border-top:3px solid var(--gold)}
.stockbar{height:6px;background:var(--chip);border-radius:99px;overflow:hidden;min-width:70px;margin-top:4px}
.stockbar>i{display:block;height:100%;background:var(--brand)}
.badge.gold{background:var(--gold-soft);color:var(--gold-text)}
details.mas{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:0 12px}
details.mas>summary{cursor:pointer;padding:11px 0;font-weight:600;color:var(--brand);list-style:none}
details.mas>summary::-webkit-details-marker{display:none}
details.mas>summary::before{content:"▸ ";color:var(--gold)}
details.mas[open]>summary::before{content:"▾ "}
details.mas[open]{padding-bottom:12px}
.partes{font-size:13px;margin-top:6px;grid-column:1/-1}
.partes div{display:flex;justify-content:space-between;gap:10px;padding:2px 0;border-top:1px dashed var(--line)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--card);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--chip)}
tfoot td{font-weight:700}
.muted{color:var(--muted)}.small{font-size:13px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media (max-width:520px){.f2{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--muted);margin-top:3px;min-height:16px}
.calc{background:var(--chip);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px;display:grid;grid-template-columns:auto auto;gap:4px 14px}
.calc b{text-align:right;font-variant-numeric:tabular-nums}
.alert{padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:14px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}.alert.bad{background:var(--bad-soft);color:var(--bad)}.alert.info{background:var(--brand-soft);color:var(--brand)}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;display:flex;gap:10px}
.fab .btn{box-shadow:0 4px 14px rgba(0,0,0,.18);font-size:20px;line-height:1.6;padding:13px 22px;border-radius:12px;white-space:nowrap}
@media (max-width:380px){.fab{right:12px;gap:8px}.fab .btn{padding:13px 18px}}
dialog{border:0;border-radius:14px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-h{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.dlg-h h2{margin:0;font-size:17px;flex:1}
.dlg-b{padding:4px 16px 16px}
.dlg-f{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card)}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#14287a;border:1px solid var(--gold);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
/* v9: logo DASH. Emblema (D + flecha + casa) en el encabezado y logo completo en las pantallas de inicio de sesión y carga. */
.logoFull{display:block;width:min(230px,66%);height:auto;aspect-ratio:1000/962;margin:0 auto 8px}
@media (prefers-color-scheme:dark){:root{--emb-b1:#9cb0ff;--emb-b2:#6383f4;--emb-b3:#3d5bd8;--emb-bd:#040a26;--emb-txt:#d4dcff}}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px}
.list-plain{margin:0;padding-left:18px}
.estado{border:0;cursor:pointer}
/* v8: editor de beneficiarios (Clientes → Editar) */
.benEd{border:1px solid var(--line);border-radius:10px;padding:8px 12px 12px;margin-top:10px}
.benEd>.row{justify-content:space-between}
.benEd>.row b{font-size:13px;color:var(--muted)}
/* v6: selector de fondo */
.fondos{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.fondo-op{border:2px solid var(--line);border-radius:12px;padding:0;background:var(--card);cursor:pointer;overflow:hidden;text-align:left}
.fondo-op .mu{height:64px;padding:10px;display:flex;flex-direction:column;gap:6px;background-attachment:scroll}
.fondo-op .mu i{display:block;height:14px;width:70%;border-radius:4px;background:#fff;box-shadow:0 1px 2px rgba(15,26,61,.15)}
.fondo-op .mu i+i{width:45%;background:#c9a227}
.fondo-op span{display:block;padding:6px 8px;font-size:12.5px;font-weight:600;border-top:1px solid var(--line)}
.fondo-op[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.fondo-op[aria-pressed="true"] span::after{content:" ✓";color:var(--gold-text)}
@media (max-width:640px){header{padding:8px 12px;gap:8px}header h1 .marca b{font-size:16px}header h1 .logo{width:28px;height:28px}.kpi .v{font-size:21px}nav.tabs{top:auto}}
@media (max-width:400px){header{padding:8px 10px}header h1{gap:6px}header h1 .logo{width:26px;height:26px}header h1 .marca b{font-size:15px}header h1 .marca small{font-size:10.5px;letter-spacing:.01em}header select{max-width:104px;padding:3px 6px}#modeBadge{font-size:11px;padding:2px 6px}}

function parseNum(v){
  if(v==null) return NaN; v=String(v).trim().replace(/\s/g,'').replace(/[$]/g,''); if(!v) return NaN;
  const hc=v.includes(','), hd=v.includes('.');
  if(hc&&hd){ v = v.lastIndexOf(',')>v.lastIndexOf('.') ? v.replace(/\./g,'').replace(',','.') : v.replace(/,/g,''); }
  else if(hc){ v = (v.match(/,/g).length>1) ? v.replace(/,/g,'') : v.replace(',','.'); }
  else if(hd){ if(v.match(/\./g).length>1) v=v.replace(/\./g,''); }
  const n=parseFloat(v.replace(/[^0-9.\-]/g,'')); return isNaN(n)?NaN:n;
}

function diasDesde(f){ return f? Math.floor((Date.now()-new Date(f).getTime())/864e5) : null; }
function normRut(r){ let s=String(r||'').toUpperCase().replace(/[.\s]/g,'').replace(/\//g,'-'); if(/^\d{7,8}[0-9K]$/.test(s)) s=s.slice(0,-1)+'-'+s.slice(-1); return s; }
function rutValido(r){ const m=/^(\d{7,8})-([0-9K])$/.exec(normRut(r)); if(!m) return false; let s=0,f=2; for(let i=m[1].length-1;i>=0;i--){ s+= +m[1][i]*f; f=f===7?2:f+1; } const dv=11-(s%11); const d= dv===11?'0': dv===10?'K': String(dv); return d===m[2]; }

const LocalStore = {
  key:'remesas_local_v1', data:{}, subs:{},
  async init(){ try{ this.data=JSON.parse(localStorage.getItem(this.key))||{}; }catch(e){ this.data={}; } COLS.forEach(c=> this.data[c]=this.data[c]||{}); },
  persist(){ try{ localStorage.setItem(this.key, JSON.stringify(this.data)); }catch(e){ toast('No se pudo guardar en el navegador'); } },
  list(c){ return Object.entries(this.data[c]).map(([id,d])=>({id,...d})); },
  emit(c){ this.persist(); this.subs[c] && this.subs[c](this.list(c)); },
  listen(c, cb){ this.subs[c]=cb; cb(this.list(c)); return ()=>{ delete this.subs[c]; }; },
  set(c,id,d,merge=true){ this.data[c][id] = merge ? {...(this.data[c][id]||{}), ...clean(d)} : clean(d); this.emit(c); return Promise.resolve(); },
  del(c,id){ delete this.data[c][id]; this.emit(c); return Promise.resolve(); },
  async batchSet(items){ items.forEach(it=>{ this.data[it.col][it.id]=clean(it.data); }); COLS.forEach(c=>this.emit(c)); },
  async logout(){}
};

  },

  listen(c, cb){ return this.m.onSnapshot(this.m.collection(this.db,c), snap=> cb(snap.docs.map(d=>({id:d.id,...d.data()}))), err=> toast('Error leyendo '+c+': '+err.code)); },
  set(c,id,d,merge=true){ return this.m.setDoc(this.m.doc(this.db,c,id), clean(d), {merge}); },

};

/* ============================================================
   2) CÁLCULOS
   - Tasa de costo de una compra = (Bs recibidos × (1 − comisión bancaria)) ÷ CLP gastados
   - Ganancia por compra = tus USDT × precio del USDT (CLP/USDT)
   - Compra directa de Bs (tipo "bs"): Bs = Bs recibidos (se ingresan desde v5);
     tasa pagada = Bs ÷ CLP (derivada);
     Bs netos = (Bs − comisión trabajador en Bs) × (1 − comisión bancaria);
     tasa de costo = Bs netos ÷ CLP. No genera ganancia por USDT: su ganancia
     aparece en el residual de los envíos que usan esos Bs.
   - Inventario (stock): cada envío consume los Bs de la compra MÁS ANTIGUA que
     todavía tenga saldo; si no alcanza, completa con la siguiente compra.
     Cada parte se costea con la tasa de SU compra.
   - Residual por envío = CLP que pagó el cliente − costo en CLP de los Bs entregados
     (si al envío le faltan Bs, el residual se calcula cuando registres la compra que lo cubre)
   - Ganancia total = ganancia por compras + residual de envíos
   ============================================================ */
function calcular(lotes, envios, cfg){
  const cb=(+cfg.comisionBanco||0)/100;
  const L=lotes.map(l=>{
    const clp=+l.clp||0, mes=(l.fecha||'').slice(0,7);
    if(l.tipo==='bs'){
      // compra directa de bolívares: pagas CLP en Chile y recibes Bs en Venezuela
      const tasa=+l.tasa||0, bs= ok(+l.bs)&&+l.bs>0 ? +l.bs : clp*tasa, bsTrab=+l.bsTrab||0;
      const tieneBs= bs>0, bsNet= Math.max(0,bs-bsTrab)*(1-cb);
      return {...l, tipo:'bs', esBs:true, clp, tasa, usdt:0, trab:0, mio:0, vend:0, precio:0, tieneBs, bs, bsTrab, bsNet,
        tasaCosto: tieneBs&&clp>0? bsNet/clp : null, tasaUSDT:null,
        ganUSDT:0, costoTrab: tasa>0? bsTrab/tasa : 0, mes, ahorro:null, refTasa:null,
        usado:0, restante:0, nEnvios:0};
    }
    const usdt=+l.usdt||0, trab=+l.usdtTrab||0, mio=+l.usdtMio||0;
    const vend=usdt-trab-mio, precio= usdt>0? clp/usdt : 0;
    const tieneBs = l.bs!=null && l.bs!=='' && +l.bs>0;
    const bs= tieneBs? +l.bs : 0, bsNet= bs*(1-cb);
    return {...l, tipo:'usdt', esBs:false, clp, usdt, trab, mio, vend, precio, tieneBs, bs, bsTrab:0, bsNet,
      tasaCosto: tieneBs&&clp>0? bsNet/clp : null,
      tasaUSDT: tieneBs&&vend>0? bs/vend : null,
      ganUSDT: mio*precio, costoTrab: trab*precio, mes,
      usado:0, restante:0, nEnvios:0};
  });
  const E=envios.map(e=>{ const clp=+e.clp||0, tasa=+e.tasa||0; const bs= ok(+e.bs)&&+e.bs>0 ? +e.bs : clp*tasa;
    return {...e, clp, tasa, bs, mes:(e.fecha||'').slice(0,7), costo:null, residual:null, partes:[], cubierto:0, falta:0}; });

  // inventario de Bs por compra: primero en entrar, primero en salir
  const porFecha=(a,b)=> (a.fecha||'').localeCompare(b.fecha||'') || ((a.createdAt||0)-(b.createdAt||0));
  const cola=L.filter(l=>l.tieneBs&&l.tasaCosto).sort(porFecha);
  cola.forEach(l=>{ l.restante=l.bsNet; });
  let i=0;
  for(const e of [...E].sort(porFecha)){
    let falta=e.bs, costo=0;
    while(falta>0.005 && i<cola.length){
      const l=cola[i], toma=Math.min(falta,l.restante);
      if(toma>0){ e.partes.push({loteId:l.id, fecha:l.fecha, bs:toma, tasa:l.tasaCosto, clp:toma/l.tasaCosto}); costo+=toma/l.tasaCosto; l.restante-=toma; l.usado+=toma; l.nEnvios++; falta-=toma; }
      if(l.restante<=0.005){ l.restante=0; i++; }
    }
    e.cubierto=e.bs-Math.max(0,falta); e.falta= falta>0.005? falta : 0; e.costoParcial=costo;
    if(!e.falta && e.bs>0){ e.costo=costo; e.residual=e.clp-costo; e.tasaCostoAplicada=e.bs/costo; }
  }
  // compras USDT con Bs: referencia para comparar las compras directas de Bs y para estimar USDT equivalentes
  const colaUSDT=cola.filter(l=>!l.esBs);
  const refUSDT=f=> [...colaUSDT].reverse().find(u=>(u.fecha||'')<=(f||'')) || colaUSDT[0] || null;
  const ultUSDTvend=[...colaUSDT].reverse().find(u=>u.vend>0);
  L.forEach(l=>{ l.estadoStock= !l.tieneBs? 'por vender' : l.restante<=0? 'agotada' : l.usado>0? 'en uso' : 'disponible';
    if(l.esBs){
      const r=refUSDT(l.fecha);
      if(r&&l.tieneBs){ l.refTasa=r.tasaCosto; l.ahorro=l.bsNet/r.tasaCosto-l.clp; }
      l.usdtRestante= ultUSDTvend? l.restante/(ultUSDTvend.bsNet/ultUSDTvend.vend) : null;
    } else l.usdtRestante= l.tieneBs? (l.bsNet>0&&l.vend>0? l.restante/(l.bsNet/l.vend) : 0) : l.vend; });
  const stockBs=cola.reduce((s,l)=>s+l.restante,0);
  const stockCosto=cola.reduce((s,l)=>s+(l.restante>0? l.restante/l.tasaCosto : 0),0);
  const ultimoLote=L.filter(l=>!l.esBs).sort((a,b)=> porFecha(b,a))[0];
  const ultimoConBs=[...cola].reverse()[0];
  const ultimoUSDTConBs=[...colaUSDT].reverse()[0];
  const tasaActual= stockBs>0? stockBs/stockCosto : (ultimoConBs? ultimoConBs.tasaCosto : null);
  const faltaBs=E.reduce((s,e)=>s+e.falta,0);

  // por mes
  const meses={};
  const M=k=> meses[k] || (meses[k]={mes:k,vol:0,n:0,bsEnv:0,residual:0,volCost:0,sinCosto:0,ganUSDT:0,mioUSDT:0,trabUSDT:0,trabCLP:0,compras:0,clpCompras:0,usdtComprados:0,clpUsdtConBs:0,bsNetUsdt:0,comprasBs:0,clpBs:0,bsBs:0,bsNetBs:0,trabBs:0,ahorroBs:0,clientes:new Set(),nuevos:0});
  E.forEach(e=>{ const m=M(e.mes); m.vol+=e.clp; m.n++; m.bsEnv+=e.bs; m.clientes.add(e.clienteId); if(e.residual!=null){ m.residual+=e.residual; m.volCost+=e.clp; } else m.sinCosto++; });
  L.forEach(l=>{ const m=M(l.mes); m.trabCLP+=l.costoTrab;
    if(l.esBs){ m.comprasBs++; m.clpBs+=l.clp; m.bsBs+=l.bs; m.bsNetBs+=l.bsNet; m.trabBs+=l.bsTrab; m.ahorroBs+=(l.ahorro||0); return; }
    m.ganUSDT+=l.ganUSDT; m.mioUSDT+=l.mio; m.trabUSDT+=l.trab; m.compras++; m.clpCompras+=l.clp; m.usdtComprados+=l.usdt;
    if(l.tieneBs){ m.clpUsdtConBs+=l.clp; m.bsNetUsdt+=l.bsNet; } });

  // por cliente
  const cli={};
  [...E].sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')).forEach(e=>{
    const c= cli[e.clienteId] || (cli[e.clienteId]={id:e.clienteId,n:0,total:0,residual:0,primero:e.fecha,ultimo:e.fecha,meses:new Set()});
    c.n++; c.total+=e.clp; c.residual+=(e.residual||0); c.ultimo=e.fecha; c.meses.add(e.mes);
  });
  Object.values(cli).forEach(c=>{ const k=(c.primero||'').slice(0,7); if(meses[k]) meses[k].nuevos++; c.dias=diasDesde(c.ultimo); });

  Object.values(meses).forEach(m=>{ m.ganancia=m.ganUSDT+m.residual; m.margen= m.vol? m.ganancia/m.vol : null; m.precioUSDT= m.usdtComprados? m.clpCompras/m.usdtComprados : null; m.nClientes=m.clientes.size; });

  const bsPend=E.filter(e=>e.estado!=='pagado').reduce((s,e)=>s+e.bs,0);
  const lotesSinBs=L.filter(l=>!l.esBs&&!l.tieneBs);
  const usdtPorVender=lotesSinBs.reduce((s,l)=>s+l.vend,0);
  const usdtEnStock=L.reduce((s,l)=>s+(l.tieneBs&&ok(l.usdtRestante)?l.usdtRestante:0),0);
  return {L,E,meses,cli,tasaActual,ultimoLote,ultimoConBs,ultimoUSDTConBs,stockBs,stockCosto,faltaBs,bsPend,lotesSinBs,usdtPorVender,usdtEnStock};
}
function usdRate(mes){ const m=C.meses[mes]; return (m&&m.precioUSDT) || (C.ultimoLote&&C.ultimoLote.precio) || +S.config.dolarRef || 920; }
const SUMABLES=['vol','n','residual','ganUSDT','mioUSDT','trabUSDT','trabCLP','sinCosto','compras','nuevos','clpUsdtConBs','bsNetUsdt','comprasBs','clpBs','bsBs','bsNetBs','trabBs','ahorroBs'];
function resumen(mes){
  if(mes){ if(C.meses[mes]) return C.meses[mes]; const z={mes,ganancia:0,margen:null,nClientes:0}; SUMABLES.forEach(k=>z[k]=0); return z; }
  const r={mes:''}; SUMABLES.forEach(k=>r[k]=0);
  Object.values(C.meses).forEach(m=>SUMABLES.forEach(k=> r[k]+=m[k]));
  r.ganancia=r.ganUSDT+r.residual; r.margen=r.vol? r.ganancia/r.vol : null; r.nClientes=Object.keys(C.cli).length; return r;
}

  }).join('')+`<line x1="10" x2="${W-10}" y1="${base}" y2="${base}" stroke="var(--line)"/></svg>`;

      <td class="n">${l.tieneBs?`<b>${fBs(l.restante)}</b>${ok(l.usdtRestante)?`<div class="muted small">≈ ${fUSDT(l.usdtRestante)}</div>`:''}`:`${fUSDT(l.vend)}<div class="muted small">por vender</div>`}</td>

function clientePorRut(r){ const id=normRut(r); return S.clientes.find(c=>c.id===id || normRut(c.rut)===id); }
function rutInput(v, editando){

function usarBen(i){
  const f=document.getElementById('fEnv'); const c=clientePorRut(f.rut.value); const b= i===''||i==='nuevo'? {} : (c.beneficiarios||[])[+i]||{};
  f.bNombre.value=b.nombre||''; f.bCedula.value=b.cedula||''; f.bBanco.value=b.banco||''; f.bCuenta.value=b.cuenta||''; f.bTel.value=b.telefono||'';

}
function usarTasaDia(){ const f=document.getElementById('fEnv'); if(!f) return; f.tasa.value=fT(S.config.tasaDia); calcEnvio(); }
function calcEnvio(){
  const f=document.getElementById('fEnv'); if(!f) return;
  const id=f.dataset.id||null;
  const clp=parseInt0(f.clp.value), tasa=parseNum(f.tasa.value);
  const bs= clp>0&&tasa>0? clp*tasa : NaN;
  const otros=S.envios.filter(x=>x.id!==id);
  const base=calcular(S.lotes, otros, S.config);
  const box=document.getElementById('envCalc');
  let html=`<span>Stock disponible ahora</span><b>${fBs(base.stockBs)}</b>`;
  if(!(bs>0)){ box.innerHTML=html+`<span>Tasa de costo del stock</span><b>${fT(base.tasaActual)}</b>`; return; }
  const prev={id:'__p', clp, tasa, bs, fecha:f.fecha.value, estado:'pendiente', createdAt:(id&&(S.envios.find(x=>x.id===id)||{}).createdAt)||Date.now()};
  const p=calcular(S.lotes, [...otros, prev], S.config).E.find(x=>x.id==='__p');
  const ref=base.ultimoConBs;
  const costoEst= p.costoParcial + (p.falta && ref ? p.falta/ref.tasaCosto : 0);
  const res= (p.falta && !ref) ? null : clp-costoEst;
  const usdtFalta= p.falta && ref && ref.vend>0 ? p.falta/(ref.bsNet/ref.vend) : null;
  html+=`<span>Llegan en Venezuela</span><b>${fBs(bs)}</b>`;
  html+=`<div class="partes">${p.partes.map(x=>`<div><span class="muted">Stock compra ${fFecha(x.fecha).slice(0,8)} · tasa ${fT(x.tasa)}</span><span>${fBs(x.bs)} = ${fCLP(x.clp)}</span></div>`).join('')}
    ${p.falta?`<div style="color:var(--bad)"><span>Faltan (requiere nueva compra)</span><span><b>${fBs(p.falta)}</b>${usdtFalta?` ≈ ${fUSDT(usdtFalta)} a vender`:''}</span></div>`:''}</div>`;
  html+=`<span>Costo${p.falta?' estimado':''}</span><b>${fCLP(costoEst)}</b>`;
  html+=`<span>Residual${p.falta?' estimado':''}</span><b class="${res<0?'neg':'pos'}">${fCLP(res)} ${ok(res)&&clp?'('+fPct(res/clp)+')':''}</b>`;
  if(ok(res) && res<0) html+=`<div class="partes" style="color:var(--bad)"><b>Con esta tasa pierdes dinero en este envío.</b></div>`;
  if(p.falta) html+=`<div class="partes muted">Puedes guardarlo igual. El costo real se completa cuando registres la compra que cubre lo que falta${ref?' (estimado con la tasa de tu última compra, '+fT(ref.tasaCosto)+')':''}.</div>`;
  box.innerHTML=html;
}
function guardarEnvio(id){
  const f=document.getElementById('fEnv'); if(!f.reportValidity()) return;
  const clp=parseInt0(f.clp.value), tasa=parseNum(f.tasa.value);
  if(!(clp>0)) return toast('Monto CLP inválido'); if(!(tasa>0)) return toast('Tasa inválida');
  const rut=f.rut.value.trim(), cid=normRut(rut); if(!cid) return toast('RUT requerido');
  const existente=clientePorRut(rut);
  const prev= id? S.envios.find(x=>x.id===id) : null;
  const nombreForm=f.nombre.value.trim();
  const ben={nombre:f.bNombre.value.trim(), cedula:f.bCedula.value.trim(), banco:f.bBanco.value.trim(), cuenta:f.bCuenta.value.trim(), telefono:f.bTel.value.trim()};
  const tieneBen=Object.values(ben).some(Boolean);
  const clienteId= existente? existente.id : cid;
  // cliente
  const benef=[...((existente&&existente.beneficiarios)||[])];
  // v8: al editar un envío antiguo sin cambiar su beneficiario, no se vuelve a agregar a la lista del cliente (pudo quitarse en Clientes → Editar)
  const kb=b=>['nombre','cedula','banco','cuenta','telefono'].map(k=>String((b&&b[k])||'').trim()).join('|');
  const benSinCambio= prev && kb(prev.beneficiario)===kb(ben);
  if(tieneBen && !benSinCambio){ const k=b=>(b.cedula+'|'+b.cuenta).toLowerCase(); const i=benef.findIndex(b=>k(b)===k(ben)); if(i>=0) benef[i]={...benef[i],...ben}; else benef.push(ben); }
  // v8: al editar un envío antiguo sin cambiar el nombre, se conserva el nombre actual del cliente (pudo cambiarse en Clientes → Editar)
  const nombreCli= existente && prev && existente.nombre && nombreForm===String(prev.clienteNombre||'').trim() ? existente.nombre : nombreForm;
  const cdata={rut:existente?existente.rut||rut:rut, nombre:nombreCli, beneficiarios:benef, actualizado:Date.now()};
  if(f.telefono.value.trim()) cdata.telefono=f.telefono.value.trim();
  if(!existente){ cdata.creado=Date.now(); const o=f.origen.value; if(o.startsWith('c:')){ cdata.referidoPor=o.slice(2); cdata.origen='Referido'; } else if(o.startsWith('o:')) cdata.origen=o.slice(2); }
  guardar('clientes', clienteId, cdata, true);
  // envío (clienteNombre = nombre escrito en el formulario: registro histórico)
  const eid= id || uid();
  guardar('envios', eid, {
    fecha:f.fecha.value, clienteId, clienteRut:cdata.rut, clienteNombre:nombreForm,
    clp, tasa, bs:Math.round(clp*tasa*100)/100, beneficiario:ben,
    comprobante:f.comprobante.value.trim(), estado: f.estado? f.estado.value : 'pagado', nota:f.nota.value.trim(),
    createdAt: prev&&prev.createdAt || Date.now(), updatedAt:Date.now()
  }, false);
  cerrarDlg(); toast(id?'Envío actualizado':'Envío registrado');
}

function calcLote(autoTramo){
  const f=document.getElementById('fLote'); if(!f) return;
  const cb=(+S.config.comisionBanco||0)/100;
  if(f.dataset.tipo==='bs'){
    // v5: la tasa ya no se escribe; se calcula con los Bs recibidos y los CLP pagados
    const clp=parseInt0(f.clp.value), bs=parseNum(f.bs.value), bsTrab=parseNum(f.bsTrab.value)||0;
    const tasa= clp>0&&bs>0? bs/clp : NaN;
    const bsNet= bs>0? Math.max(0,bs-bsTrab)*(1-cb) : NaN, tc= bsNet>0&&clp>0? bsNet/clp : null;
    const ref=C.ultimoUSDTConBs, ahorro= tc&&ref? bsNet/ref.tasaCosto-clp : null;
    const td=+S.config.tasaDia, ganDia= tc&&td>0? bsNet/td-clp : null;
    const r=f.dRut.value.trim(); document.getElementById('dRutHint').textContent= r&&!rutValido(r)? 'RUT no válido (ok si es otro documento)' : '';
    document.getElementById('loteCalc').innerHTML=`
      <span>Tasa que pagaste (Bs por CLP)</span><b>${fT(tasa)}</b>
      <span>Bs recibidos en Venezuela</span><b>${fBs(bs)}</b>
      <span>− Comisión trabajador</span><b>${fBs(bsTrab)}</b>
      <span>Bs netos (−${S.config.comisionBanco}% banco)</span><b>${fBs(bsNet)}</b>
      <span>Tasa de costo (Bs por CLP)</span><b>${fT(tc)}</b>
      <span>Costo trabajador</span><b>${tasa>0?fCLP(bsTrab/tasa):'—'}</b>
      <span>Ahorro vs última compra USDT (${fT(ref&&ref.tasaCosto)})</span><b class="${ahorro<0?'neg':'pos'}">${ok(ahorro)?(ahorro>=0?'ahorras ':'pagas de más ')+fCLP(Math.abs(ahorro)):'—'}</b>
      ${td>0?`<span>Ganancia estimada si envías estos Bs a la tasa del día (${fT(td)})</span><b class="${ganDia<0?'neg':'pos'}">${ok(ganDia)?fCLP(ganDia)+(clp?' ('+fPct(ganDia/clp)+')':''):'—'}</b>`:''}
      <div class="partes muted">Estimación informativa: la ganancia real aparece en el residual de los envíos que usen estos Bs (cada uno con su propia tasa). No se suma aparte a la ganancia total.</div>`;
    return;
  }
  const clp=parseInt0(f.clp.value), usdt=parseNum(f.usdt.value), bs=parseNum(f.bs.value);
  if(autoTramo && usdt>0){ const t=tramoPara(usdt); f.trab.value=t.trab; f.mio.value=t.mio; document.getElementById('tramoHint').textContent=`Tramo aplicado: ${t.trab} + ${t.mio} USDT`; }
  const trab=parseNum(f.trab.value)||0, mio=parseNum(f.mio.value)||0;
  const vend=usdt-trab-mio, precio=usdt>0?clp/usdt:null, bsNet= bs>0? bs*(1-cb):null;
  document.getElementById('bsHint').textContent= bs>0? '= '+fBs(bs) : '';
  document.getElementById('loteCalc').innerHTML=`
    <span>Precio USDT</span><b>${fCLP(precio)}</b>
    <span>USDT a vender en Venezuela</span><b>${ok(vend)?nf2.format(vend):'—'}</b>
    <span>Bs netos (−${S.config.comisionBanco}%)</span><b>${fBs(bsNet)}</b>
    <span>Bs por USDT vendido</span><b>${bs>0&&vend>0?nf2.format(bs/vend):'—'}</b>
    <span>Tasa de costo (Bs por CLP)</span><b>${bsNet&&clp?fT(bsNet/clp):'—'}</b>
    <span>Tu ganancia en USDT</span><b class="pos">${precio?fCLP(mio*precio):'—'}</b>
    <span>Costo trabajador</span><b>${precio?fCLP(trab*precio):'—'}</b>`;
}
function guardarLote(id){
  const f=document.getElementById('fLote'); if(!f.reportValidity()) return;
  const prev= id? S.lotes.find(x=>x.id===id) : null;
  const base={fecha:f.fecha.value, nota:f.nota.value.trim(), createdAt: prev&&prev.createdAt || Date.now(), updatedAt:Date.now()};
  if(f.dataset.tipo==='bs'){
    const clp=parseInt0(f.clp.value), bsIn=parseNum(f.bs.value), bsTrab=parseNum(f.bsTrab.value)||0;
    if(!(clp>0)) return toast('CLP inválido'); if(!(bsIn>0)) return toast('Bs recibidos inválidos');
    const bs=Math.round(bsIn*100)/100, tasa=bs/clp; // v5: la tasa se deriva (Bs ÷ CLP)
    if(bsTrab<0||bsTrab>=bs) return toast('Comisión del trabajador inválida');
    guardar('lotes', id||uid(), {...base, tipo:'bs', clp, tasa, bs, bsTrab, usdt:0, usdtTrab:0, usdtMio:0,
      destinatario:{nombre:f.dNombre.value.trim(), rut:f.dRut.value.trim()? normRut(f.dRut.value) : ''}}, false);
  } else {
    const clp=parseInt0(f.clp.value), usdt=parseNum(f.usdt.value), bs=parseNum(f.bs.value);
    if(!(clp>0)) return toast('CLP inválido'); if(!(usdt>0)) return toast('USDT inválido');
    guardar('lotes', id||uid(), {...base, tipo:'usdt', clp, usdt, usdtTrab:parseNum(f.trab.value)||0, usdtMio:parseNum(f.mio.value)||0,
      bs: bs>0? bs : null}, false);
  }
  cerrarDlg(); toast(id?'Compra actualizada':'Compra registrada');
}

function abrirCliente(id){
  const c=S.clientes.find(x=>x.id===id); if(!c) return toast('Cliente no encontrado');
  const a=C.cli[id]||{n:0,total:0,residual:0};
  const es=C.E.filter(e=>e.clienteId===id).sort((x,y)=>(y.fecha||'').localeCompare(x.fecha||''));
  const refs=S.clientes.filter(x=>x.referidoPor===id);
  abrirDlg(`
  <div class="dlg-h"><h2>${esc(c.nombre)}</h2><button class="x" onclick="App.cerrar()">×</button></div>
  <div class="dlg-b">
    <div class="calc">
      <span>RUT / documento</span><b>${esc(c.rut||c.id)}</b><span>Teléfono</span><b>${esc(c.telefono||'—')}</b>
      ${c.nota?`<span>Nota</span><b style="white-space:normal;overflow-wrap:anywhere">${esc(c.nota)}</b>`:''}
    </div>
    <div class="calc">
      <span>Envíos</span><b>${a.n}</b><span>Total enviado</span><b>${fCLP(a.total)}</b>
      <span>Residual generado</span><b>${fCLP(a.residual)}</b><span>Promedio por envío</span><b>${fCLP(a.n?a.total/a.n:null)}</b>
      <span>Último envío</span><b>${a.ultimo?fFecha(a.ultimo):'—'}</b><span>Origen</span><b>${c.referidoPor?'Referido por '+esc((S.clientes.find(x=>x.id===c.referidoPor)||{}).nombre||''):esc(c.origen||'—')}</b>
      <span>Clientes que trajo</span><b>${refs.length}</b>
    </div>
    <h3 style="margin:16px 0 6px;font-size:14px">Beneficiarios</h3>
    ${(c.beneficiarios||[]).length? `<ul class="list-plain small">${c.beneficiarios.map(b=>`<li>${esc(b.nombre)} · C.I. ${esc(b.cedula)} · ${esc(b.banco)} ${esc(b.cuenta)} ${esc(b.telefono)}</li>`).join('')}</ul>`:'<div class="muted small">Sin beneficiarios guardados.</div>'}
    <h3 style="margin:16px 0 6px;font-size:14px">Historial</h3>
    <div class="tablewrap"><table><thead><tr><th>Fecha</th><th class="n">CLP</th><th class="n">Tasa</th><th class="n">Bs</th><th>Beneficiario</th><th>Estado</th></tr></thead>
    <tbody>${es.map(e=>`<tr class="click" onclick="App.abrirEnvio('${e.id}')"><td>${fFecha(e.fecha)}</td><td class="n">${fCLP(e.clp)}</td><td class="n">${fT(e.tasa)}</td><td class="n">${fBs(e.bs)}</td><td>${esc(e.beneficiario&&e.beneficiario.nombre)}</td><td><span class="badge ${e.estado==='pagado'?'ok':'warn'}">${e.estado==='pagado'?'Pagado':'Pendiente'}</span></td></tr>`).join('')||'<tr><td colspan="6" class="muted">Sin envíos</td></tr>'}</tbody></table></div>
  </div>
  <div class="dlg-f"><button class="btn danger" onclick="App.borrarCliente('${esc(c.id)}')">Eliminar</button><span class="spacer"></span><button class="btn" onclick="App.cerrar()">Cerrar</button><button class="btn pri" onclick="App.editarCliente('${esc(c.id)}')">Editar</button></div>`);
}
/* v8: Clientes → Editar. El RUT es el ID del documento y no se puede cambiar (dejaría sus envíos sin cliente).
   Los envíos antiguos conservan el nombre con que se registraron (clienteNombre). */
const ORIGENES=['Referido','Redes sociales','WhatsApp / chatbot','Agente','Otro'];
function filaBen(b){ b=b||{}; return `<div class="benEd"><div class="row"><b>Beneficiario</b><button type="button" class="btn sm danger" onclick="this.closest('.benEd').remove()">Quitar</button></div>
  <div class="f2">
    <div><label>Nombre</label><input class="bN" value="${esc(b.nombre||'')}"></div>
    <div><label>Cédula</label><input class="bC" value="${esc(b.cedula||'')}"></div>
    <div><label>Banco</label><input class="bB" value="${esc(b.banco||'')}"></div>
    <div><label>Cuenta / pago móvil</label><input class="bK" value="${esc(b.cuenta||'')}"></div>
    <div><label>Teléfono</label><input class="bT" inputmode="tel" value="${esc(b.telefono||'')}"></div>
  </div></div>`; }
function editarCliente(id){
  const c=S.clientes.find(x=>x.id===id); if(!c) return toast('Cliente no encontrado');
  const origen= c.origen || (c.referidoPor?'Referido':'');
  const ops=[...ORIGENES]; if(origen && !ops.includes(origen)) ops.push(origen);
  const otros=S.clientes.filter(x=>x.id!==id).sort((a,b)=>String(a.nombre||'').localeCompare(String(b.nombre||''),'es'));
  const refHuerfano= c.referidoPor && !otros.some(x=>x.id===c.referidoPor);
  abrirDlg(`
  <div class="dlg-h"><h2>Editar cliente</h2><button class="x" onclick="App.cerrar()">×</button></div>
  <form id="fCliEd" class="dlg-b" autocomplete="off" onsubmit="return false">
    <div class="f2">
      <div><label>Nombre</label><input name="nombre" required value="${esc(c.nombre||'')}"></div>
      <div><label>RUT / documento</label><input value="${esc(c.rut||c.id)}" disabled><div class="hint">No se puede cambiar: identifica al cliente y a sus envíos.</div></div>
      <div><label>Teléfono (WhatsApp)</label><input name="telefono" inputmode="tel" value="${esc(c.telefono||'')}"></div>
      <div><label>¿Cómo llegó? (origen)</label><select name="origen" onchange="document.getElementById('refBox').classList.toggle('hidden',this.value!=='Referido')"><option value="">Sin dato</option>${ops.map(o=>`<option value="${esc(o)}" ${o===origen?'selected':''}>${esc(o)}</option>`).join('')}</select></div>
      <div id="refBox" class="${origen==='Referido'?'':'hidden'}"><label>Referido por</label><select name="referidoPor"><option value="">— Sin dato —</option>${otros.map(x=>`<option value="${esc(x.id)}" ${x.id===c.referidoPor?'selected':''}>${esc(x.nombre||x.id)} · ${esc(x.rut||x.id)}</option>`).join('')}${refHuerfano?`<option value="${esc(c.referidoPor)}" selected>${esc(c.referidoPor)} (no encontrado)</option>`:''}</select></div>
      <div><label>Nota</label><input name="nota" value="${esc(c.nota||'')}"></div>
    </div>
    <h3 style="margin:16px 0 0;font-size:14px">Beneficiarios</h3>
    <div id="benEd">${(c.beneficiarios||[]).map(filaBen).join('')}</div>
    <div class="row" style="margin-top:10px"><button type="button" class="btn sm" onclick="App.addBen()">+ Agregar beneficiario</button></div>
  </form>
  <div class="dlg-f"><span class="spacer"></span><button class="btn" onclick="App.abrirCliente('${esc(c.id)}')">Cancelar</button><button class="btn pri" onclick="App.guardarCliente('${esc(c.id)}')">Guardar</button></div>`);
}
function addBen(){ const box=document.getElementById('benEd'); if(!box) return; box.insertAdjacentHTML('beforeend', filaBen({})); const n=box.lastElementChild.querySelector('.bN'); n&&n.focus(); }
function guardarCliente(id){
  const f=document.getElementById('fCliEd'); if(!f||!f.reportValidity()) return;
  const nombre=f.nombre.value.trim(); if(!nombre) return toast('Nombre requerido');
  const origen=f.origen.value, v=(b,k)=>b.querySelector(k).value.trim();
  const beneficiarios=[...document.querySelectorAll('#benEd .benEd')].map(b=>({nombre:v(b,'.bN'), cedula:v(b,'.bC'), banco:v(b,'.bB'), cuenta:v(b,'.bK'), telefono:v(b,'.bT')}))
    .filter(b=>Object.values(b).some(Boolean));
  const data={nombre, telefono:f.telefono.value.trim(), origen, referidoPor: origen==='Referido'? f.referidoPor.value : '', nota:f.nota.value.trim(), beneficiarios, actualizado:Date.now()};
  guardar('clientes', id, data, true); // merge: no toca rut ni creado
  const i=S.clientes.findIndex(x=>x.id===id); if(i>=0) S.clientes[i]={...S.clientes[i], ...data}; // para volver al detalle ya actualizado
  render(); abrirCliente(id); toast('Cliente actualizado');
}
function borrarCliente(id){
  const n=S.envios.filter(e=>e.clienteId===id).length;
  if(n) return toast(`Tiene ${n} envíos. Elimina primero sus envíos.`);
  if(confirm('¿Eliminar este cliente?')){ eliminar('clientes',id); cerrarDlg(); }
}
function borrar(col,id){ if(confirm('¿Eliminar este registro? No se puede deshacer.')){ eliminar(col,id); cerrarDlg(); toast('Eliminado'); } }
function toggleEstado(id){ const e=S.envios.find(x=>x.id===id); if(!e) return; guardar('envios', id, {estado: e.estado==='pagado'?'pendiente':'pagado', updatedAt:Date.now()}, true); }

function guardarAjustes(){
  const g=id=>document.getElementById(id).value;
  const tramos=[...document.querySelectorAll('#tramosBody tr')].map(tr=>({
    desde: parseNum(tr.querySelector('.tDesde').value)||0,
    hasta: tr.querySelector('.tHasta').value.trim()===''? null : parseNum(tr.querySelector('.tHasta').value),
    trab: parseNum(tr.querySelector('.tTrab').value)||0, mio: parseNum(tr.querySelector('.tMio').value)||0
  })).sort((a,b)=>a.desde-b.desde);
  const cfg={tasaDia:parseNum(g('cfTasa')), comisionBanco:parseNum(g('cfBanco')), metaUSD:parseInt0(g('cfMeta')), diasInactivo:parseInt0(g('cfDias')), dolarRef:parseInt0(g('cfDolar')), tramos,
    fondo: S.config.fondo||DEFAULT_CONFIG.fondo}; // v6: se conserva el fondo elegido (esta escritura reemplaza el documento)
  for(const k of ['tasaDia','comisionBanco','metaUSD','diasInactivo','dolarRef']) if(!ok(cfg[k])) return toast('Valor inválido: '+k);
  guardar('config','general',cfg,false); toast('Ajustes guardados');
}
function setFondo(k){
  if(!FONDOS.some(f=>f.k===k)) return;
  S.config.fondo=k; aplicarFondo(k);
  document.querySelectorAll('.fondo-op').forEach(b=> b.setAttribute('aria-pressed', String(b.dataset.fondo===k)));
  guardar('config','general',{fondo:k},true); // merge: no toca los demás ajustes
}
function addTramo(){ document.getElementById('tramosBody').insertAdjacentHTML('beforeend', filaTramo({desde:'',hasta:'',trab:0,mio:0})); }

/* ---------- exportar / importar ---------- */
function exportJSON(){
  const data={version:1, exportado:new Date().toISOString(), clientes:S.clientes, envios:S.envios, lotes:S.lotes, config:S.config};
  descargar(`remesas-respaldo-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(data,null,2), 'application/json');
}
function csv(rows){ return '\ufeff'+rows.map(r=>r.map(v=>{ const s=v==null?'':String(v); return /[;"\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; }).join(';')).join('\n'); }
const dec=n=> ok(n)? String(Math.round(n*100)/100).replace('.',',') : '';
function exportCSV(tipo){
  let rows;
  if(tipo==='envios') rows=[['Fecha','Cliente','RUT','CLP','Tasa','Bs','Costo CLP','Residual CLP','Beneficiario','Cédula','Banco','Cuenta','Estado','Comprobante','Nota'],
    ...C.E.sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')).map(e=>[e.fecha,e.clienteNombre,e.clienteRut,e.clp,String(e.tasa).replace('.',','),dec(e.bs),dec(e.costo),dec(e.residual),e.beneficiario&&e.beneficiario.nombre,e.beneficiario&&e.beneficiario.cedula,e.beneficiario&&e.beneficiario.banco,e.beneficiario&&e.beneficiario.cuenta,e.estado,e.comprobante,e.nota])];
  else if(tipo==='lotes') rows=[['Fecha','Tipo','CLP','USDT','Precio USDT','USDT trabajador','USDT tuyos','USDT vendidos','Tasa pagada (Bs/CLP)','Bs trabajador','Bs recibidos','Bs netos','Tasa costo','Ganancia USDT CLP','Ahorro vs USDT CLP','Transferido a','RUT transferido','Nota'],
    ...C.L.sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')).map(l=>[l.fecha,l.esBs?'Bs':'USDT',l.clp,l.esBs?'':dec(l.usdt),l.esBs?'':dec(l.precio),l.esBs?'':dec(l.trab),l.esBs?'':dec(l.mio),l.esBs?'':dec(l.vend),l.esBs?String(l.tasa).replace('.',','):'',l.esBs?dec(l.bsTrab):'',l.tieneBs?dec(l.bs):'',l.tieneBs?dec(l.bsNet):'',l.tasaCosto?String(l.tasaCosto.toFixed(6)).replace('.',','):'',l.esBs?'':dec(l.ganUSDT),l.esBs?dec(l.ahorro):'',l.destinatario&&l.destinatario.nombre,l.destinatario&&l.destinatario.rut,l.nota])];
  else rows=[['RUT','Nombre','Teléfono','Origen','Referido por','Envíos','Total CLP','Residual CLP','Último envío','Días sin enviar'],
    ...S.clientes.map(c=>{ const a=C.cli[c.id]||{}; return [c.rut||c.id,c.nombre,c.telefono,c.origen,(S.clientes.find(x=>x.id===c.referidoPor)||{}).nombre||'',a.n||0,a.total||0,dec(a.residual||0),a.ultimo||'',a.dias??'']; })];
  descargar(`remesas-${tipo}-${new Date().toISOString().slice(0,10)}.csv`, csv(rows), 'text/csv;charset=utf-8');
}
async function importJSON(file){
  if(!file) return;
  try{
    const d=JSON.parse(await file.text()); const items=[];
    ['clientes','envios','lotes'].forEach(c=> (d[c]||[]).forEach(o=>{ const {id,...rest}=o; if(id) items.push({col:c,id,data:rest}); }));
    if(d.config) items.push({col:'config',id:'general',data:d.config});
    if(!items.length) return toast('El archivo no tiene datos');
    if(!confirm(`Se importarán ${items.length} registros. ¿Continuar?`)) return;
    await Store.batchSet(items); toast('Importación lista');
  }catch(e){ toast('Archivo inválido: '+e.message); }
}

/* ============================================================
   5) ARRANQUE
   ============================================================ */
function startData(){
  stopData();
  ['clientes','envios','lotes'].forEach(c=> unsubs.push(Store.listen(c, docs=>{ S[c]=docs; render(); })));
  unsubs.push(Store.listen('config', docs=>{ const g=docs.find(d=>d.id==='general'); S.config={...structuredClone(DEFAULT_CONFIG), ...(g||{})}; delete S.config.id;
    if(g && !g.fondo) S.config.fondo='original'; // v6: quien ya tenía ajustes guardados conserva el fondo de siempre hasta que elija otro
    aplicarFondo(S.config.fondo); render(); }));
}
function stopData(){ unsubs.forEach(u=>{ try{u&&u()}catch(e){} }); unsubs=[]; }
function mostrar(v){ ['loginView','appView','loadingView'].forEach(x=> document.getElementById(x).classList.toggle('hidden', x!==v)); }

document.getElementById('tabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) go(b.dataset.v); });
document.getElementById('mesSel').addEventListener('change', e=>{ S.mes=e.target.value; render(); });

window.App = {
  go, cerrar:cerrarDlg, abrirEnvio, abrirLote, abrirCliente, rutInput, usarBen, calcEnvio, calcLote,
  usarTasaDia, guardarEnvio, guardarLote, guardarCliente, editarCliente, addBen, borrarCliente, borrar, toggleEstado, guardarAjustes, addTramo, setFondo,
  exportJSON, exportCSV, importJSON,
  buscar(v){ S.q=v; S._focusQ=true; render(); }, setEstado(v){ S.estado=v; render(); }, setInactivos(v){ S.soloInactivos=v; render(); },
  async salir(){ await Store.logout(); }
};

async function main(){
  const badge=document.getElementById('modeBadge');
  if(MODO_LOCAL){
    Store=LocalStore; await Store.init();
    badge.textContent='Modo local'; badge.className='badge warn'; badge.title='Datos solo en este navegador. Configura Firebase para sincronizar.';
    startData(); mostrar('appView'); return;
  }
  Store=FireStore;
  FireStore.onAuth=u=>{
    if(u){ S.email=u.email; badge.textContent='En línea'; badge.className='badge ok'; startData(); mostrar('appView'); }
    else { stopData(); mostrar('loginView'); }
  };
  try{ await Store.init(); }
  catch(e){ document.getElementById('loadingView').innerHTML=`<div class="card"><b>No se pudo cargar Firebase.</b><p class="muted small">${esc(e.message)}</p></div>`; return; }
  window.addEventListener('online', ()=>{ badge.textContent='En línea'; badge.className='badge ok'; });
  window.addEventListener('offline',()=>{ badge.textContent='Sin conexión (se sincroniza al volver)'; badge.className='badge warn'; });
  document.getElementById('loginForm').addEventListener('submit', async ev=>{
    ev.preventDefault(); const err=document.getElementById('lgErr'); err.textContent='';
    try{ await Store.login(document.getElementById('lgEmail').value.trim(), document.getElementById('lgPass').value); }
    catch(e){ err.textContent= e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found' ? 'Correo o contraseña incorrectos' : 'Error: '+(e.code||e.message); }
  });
}
main();
</script>
